project_id = "tolo-ecommerce"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true

[edge_runtime]
enabled = true

# Called server-to-server by the Tolo backend, which holds no Supabase JWT;
# its own shared key (TOLO_BACKEND_INBOUND_KEY) is the only gate. See
# docs/integration/tolo-app.md.
[functions.merchant-application-status]
verify_jwt = false

# Called by an external payment gateway's server, which holds no Supabase JWT.
# The gateway's own signature, checked by its adapter in
# _shared/payment_providers.ts, is the only gate -- and with no gateway
# registered (the default) every call is refused. See
# docs/integration/payments-and-sms.md.
[functions.payment-webhook]
verify_jwt = false

# Internal: called only by order-status, with the service-role key as the
# bearer. The function compares that key itself (rather than relying on the
# gateway's JWT check, which would also admit any signed-in user's token).
# Does nothing unless TOLO_DELIVERY_HANDOFF_ENABLED=true. See
# docs/integration/delivery-handoff.md.
[functions.delivery-handoff]
verify_jwt = false
