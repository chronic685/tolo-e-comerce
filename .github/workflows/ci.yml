name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  frontend-apps:
    name: Lint, typecheck, build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, merchant-dashboard, admin-dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # npm workspaces (frontend/merchant-dashboard/admin-dashboard/packages/*
      # share one root lockfile) -- install once at the repo root, then run
      # each app's scripts scoped to its workspace.
      - run: npm ci
      - run: npm run lint --workspace=${{ matrix.app }}
      - run: npm run build --workspace=${{ matrix.app }}

  api-client:
    name: API client is current, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # src/schema.d.ts is generated from openapi.json (a copy of the API repo's committed document). It must be committed up to date.
      - name: Generated client is current
        run: |
          npm run generate --workspace=@tolo/api-client
          git diff --exit-code -- packages/api-client/src/schema.d.ts || (echo "Run: npm run generate -w @tolo/api-client, and commit the result." && exit 1)
      - run: npm run typecheck --workspace=@tolo/api-client
      - run: npx vitest run --project packages/api-client

  backend-tests:
    name: Regression & security smoke tests (local Supabase)
    runs-on: ubuntu-latest
    # Runs against a throwaway Supabase started inside this runner, never the
    # live project: no Supabase URL/key secrets are referenced anywhere in
    # this job, and tests/env.ts refuses a non-local SUPABASE_URL under CI.
    env:
      # Fixed credentials for accounts that only ever exist in the local
      # database below -- not secrets.
      QA_MERCHANT_A_EMAIL: qa-merchant-a@ci.local
      QA_MERCHANT_A_PASSWORD: ci-merchant-a-password
      QA_MERCHANT_B_EMAIL: qa-merchant-b@ci.local
      QA_MERCHANT_B_PASSWORD: ci-merchant-b-password
      QA_CUSTOMER_EMAIL: qa-customer@ci.local
      QA_CUSTOMER_PASSWORD: ci-customer-password
      QA_STAFF_EMAIL: qa-staff@ci.local
      QA_STAFF_PASSWORD: ci-staff-password
      # Must match tests/ci/functions.env. Also what enables
      # tests/smoke/tolo-app-functions.test.ts, which needs the Tolo
      # backend stub below and so only runs here.
      TOLO_CI_INBOUND_KEY: ci-tolo-inbound-key
      # Must match TOLO_BACKEND_SHARED_KEY in tests/ci/functions.env and the
      # stub step below; lets delivery-handoff-functions.test.ts read back what
      # the stub received.
      TOLO_CI_SHARED_KEY: ci-tolo-shared-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Applies every migration in supabase/migrations, then supabase/seed.sql.
      - name: Start local Supabase
        run: npx supabase start

      - name: Point the tests at the local stack
        run: |
          npx supabase status -o env > supabase.env
          set -a; . ./supabase.env; set +a
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"
          rm supabase.env

      # Stand-in for the Tolo backend's verify-code endpoint, which
      # tolo-app-login / tolo-merchant-login call. The functions reach it at
      # host.docker.internal:54399 (tests/ci/functions.env).
      - name: Start Tolo backend stub
        run: |
          TOLO_BACKEND_SHARED_KEY=ci-tolo-shared-key node tests/ci/tolo-backend-stub.mjs > tolo-stub.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:54399/health > /dev/null && echo "Tolo stub ready" && exit 0
            sleep 1
          done
          echo "Tolo stub never became ready:"; cat tolo-stub.log; exit 1

      - name: Serve Edge Functions locally
        run: |
          npx supabase functions serve --env-file tests/ci/functions.env > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$SUPABASE_URL/functions/v1/order-status" || true)
            [ "$code" = "200" ] && echo "Edge Functions ready" && exit 0
            sleep 2
          done
          echo "Edge Functions never became ready:"; cat functions.log; exit 1

      - name: Bootstrap QA staff admin (local database only)
        run: bash tests/ci/bootstrap-local-db.sh

      - run: npm test

      - name: Edge Function logs
        if: failure()
        run: |
          cat functions.log || true
          echo "--- Tolo backend stub ---"
          cat tolo-stub.log || true
